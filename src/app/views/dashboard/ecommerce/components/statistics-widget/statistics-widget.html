<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <div class="avatar fs-60 avatar-img-size flex-shrink-0">
        <span class="avatar-title rounded-circle fs-24" [class]="item.className">
          <iconify-icon [icon]="item.icon"></iconify-icon>
        </span>
      </div>
      <div class="text-end">
        <h3 class="mb-2 fw-normal">
          <span
            [countUp]="item.value"
            [countUpOptions]="{ prefix: item.prefix || '',
                    suffix: item.suffix || '',
                    decimalPlaces: Number.isInteger(item.value) ? 0 : 2 }"
          ></span>
        </h3>
        <p class="mb-0 text-muted"><span>{{item.title}}</span></p>
      </div>
    </div>
  </div>
</div>
