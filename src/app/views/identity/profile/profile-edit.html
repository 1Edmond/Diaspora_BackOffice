<div class="container-fluid">
  <app-page-breadcrumb title="My Profile" subTitle="Identity" />
  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          @if(success) {
          <div class="alert alert-success">{{success}}</div>
          }
          @if(error) {
          <div class="alert alert-danger">{{error}}</div>
          }
          <form #profileForm="ngForm" (ngSubmit)="onSubmit(profileForm)">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" name="firstName" [(ngModel)]="formData.firstName" />
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" name="lastName" [(ngModel)]="formData.lastName" />
              </div>
              <div class="col-md-6">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" [(ngModel)]="formData.phoneNumber" />
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="loading">Update Profile</button>
              <a routerLink="/identity/users/profile" class="btn btn-light">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
