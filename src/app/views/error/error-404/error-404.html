<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>
          <div class="auth-brand text-center mb-2">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" height="28" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" height="28" />
            </a>
          </div>

          <div class="p-4 text-center">
            <div class="error-text-alt fs-72 text-warning">404</div>
            <h3 class="fw-bold text-uppercase">Page Not Found</h3>
            <p class="text-muted fs-5">The page you're looking for can't be found. It may be missing or the URL is incorrect.</p>

            <div class="mt-4 d-flex justify-content-center gap-1">
              <button class="btn btn-primary" routerLink="/">Go Home</button>
              <button class="btn btn-outline-info">Search Site</button>
            </div>
          </div>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{ currentYear }} {{ name }} — by
          <span class="fw-semibold">{{ author }}</span>
        </p>
      </div>
    </div>
  </div>
</div>
