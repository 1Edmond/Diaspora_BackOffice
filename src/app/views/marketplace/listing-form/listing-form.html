<div class="container-fluid">
  <app-page-breadcrumb [title]="isEdit ? 'Edit Listing' : 'New Listing'" subTitle="Marketplace" />

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          @if(error) {
          <div class="alert alert-danger">{{error}}</div>
          }

          <div class="mb-3">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="model.title" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Category <span class="text-danger">*</span></label>
            <select class="form-select" [(ngModel)]="model.categoryId">
              <option value="">Select category...</option>
              @for (cat of categories; track cat.id) {
              <option [value]="cat.id">{{cat.name}}</option>
              }
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="4" [(ngModel)]="model.description"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Info</label>
            <input type="text" class="form-control" [(ngModel)]="model.contactInfo" placeholder="e.g. email, phone or address" />
          </div>
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" [(ngModel)]="model.price" min="0" step="0.01" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Currency</label>
              <input type="text" class="form-control" [(ngModel)]="model.currency" placeholder="EUR" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Payment Mode <span class="text-danger">*</span></label>
              <select class="form-select" [(ngModel)]="model.paymentMode">
                <option [ngValue]="PaymentMode.ContactOnly">Contact Only</option>
                <option [ngValue]="PaymentMode.WalletPayment">Wallet Payment</option>
                <option [ngValue]="PaymentMode.Both">Both</option>
              </select>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary" [disabled]="!model.title || !model.categoryId || saving" (click)="save()">
              @if(saving) { Saving... } @else { Save }
            </button>
            <a routerLink="/marketplace/listings" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
