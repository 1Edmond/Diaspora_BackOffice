<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4 shadow-sm border-0">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>

          <div class="auth-brand text-center mb-3 position-relative">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
          </div>

          <div class="text-center mb-4 position-relative">
            <div
              class="rounded-circle bg-soft-primary text-primary fw-bold d-inline-flex align-items-center justify-content-center mb-2 border border-primary-subtle"
              style="width: 72px; height: 72px; font-size: 1.5rem;"
            >
              {{ initials }}
            </div>
            <h5 class="fs-md fw-bold mb-1">{{ displayName }}</h5>
            @if (currentUser?.email) {
              <p class="text-muted fs-xs mb-2">{{ currentUser?.email }}</p>
            }
            <span class="badge bg-soft-warning text-warning">
              <app-icon icon="lock" class="me-1 align-middle"></app-icon>
              Session verrouillée
            </span>
          </div>

          <form (ngSubmit)="onSubmit(f)" #f="ngForm" novalidate>
            <div class="mb-3">
              <label for="userPassword" class="form-label fw-medium">
                Mot de passe
                <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light-subtle">
                  <app-icon icon="key-round" class="text-muted"></app-icon>
                </span>
                <input
                  type="password"
                  class="form-control"
                  id="userPassword"
                  name="password"
                  placeholder="Saisissez votre mot de passe"
                  required
                  [(ngModel)]="password"
                />
              </div>
            </div>

            @if (error) {
              <div class="alert alert-danger py-2 px-3 fs-sm d-flex align-items-center gap-2 mb-3">
                <app-icon icon="alert-circle" class="flex-shrink-0 fs-5"></app-icon>
                <span>{{ error }}</span>
              </div>
            }

            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-primary fw-semibold py-2 d-flex align-items-center justify-content-center"
                [disabled]="loading || f.invalid"
              >
                @if (loading) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  <span>Déverrouillage en cours...</span>
                } @else {
                  <app-icon icon="unlock" class="me-1 align-middle"></app-icon>
                  <span>Déverrouiller la session</span>
                }
              </button>
            </div>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <button
              type="button"
              class="btn btn-link text-decoration-underline link-offset-3 fw-semibold p-0 fs-sm"
              (click)="logout()"
            >
              Ce n'est pas vous ? Se connecter avec un autre compte
            </button>
          </div>
        </div>

        <p class="text-center text-muted mt-4 mb-0 fs-sm">
          © {{ currentYear }} Diaspora. Tous droits réservés.
        </p>
      </div>
    </div>
  </div>
</div>
