<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>
          <div class="auth-brand text-center mb-3 position-relative">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
            <p class="text-muted w-lg-75 mt-3 mx-auto">This screen is locked. Enter your PIN to continue.</p>
          </div>

          <div class="text-center mb-4">
            <img src="assets/images/users/user-1.jpg" class="rounded-circle img-thumbnail avatar-xxl mb-2" alt="thumbnail" />
            <h5 class="fs-md">{{ username }}</h5>
          </div>

          <form>
            <label class="form-label">
              Enter your 6-digit code
              <span class="text-danger">*</span>
            </label>
            <ng-otp-input [config]="{ length: 6, allowNumbersOnly:true, inputClass:'form-control text-center mb-3',}"> </ng-otp-input>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary fw-semibold py-2">Confirm</button>
            </div>
          </form>
          <p class="text-muted text-center mt-4 mb-0">
            Not you? Return to
            <a routerLink="/auth/sign-in" class="text-decoration-underline link-offset-3 fw-semibold">Sign in</a>
          </p>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{ currentYear }} {{ name }} — by
          <span class="fw-semibold">{{ author }}</span>
        </p>
      </div>
    </div>
  </div>
</div>
