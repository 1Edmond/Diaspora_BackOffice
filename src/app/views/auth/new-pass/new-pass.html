<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>
          <div class="auth-brand text-center mb-4">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
            <p class="text-muted w-lg-75 mt-3 mx-auto">We've emailed you a 6-digit verification code. Please enter it below to confirm your email address</p>
          </div>

          <form>
            <div class="mb-3">
              <label for="userEmail" class="form-label">
                Email address
                <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <input type="email" class="form-control" id="userEmail" placeholder="you@example.com" disabled />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Enter your 6-digit code
                <span class="text-danger">*</span>
              </label>
              <ng-otp-input [config]="{ length: 6, allowNumbersOnly:true, inputClass:'form-control text-center',}"> </ng-otp-input>
            </div>

            <div class="mb-3" data-password="bar">
              <label for="userPassword" class="form-label">
                Password
                <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <input type="password" name="password" class="form-control" id="userPassword" placeholder="••••••••" required [(ngModel)]="password" />
              </div>

              <app-password-strength-bar [password]="password"></app-password-strength-bar>
            </div>

            <div class="mb-3">
              <label for="userNewPassword" class="form-label">
                Confirm New Password
                <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <input type="password" class="form-control" id="userNewPassword" placeholder="••••••••" required />
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input form-check-input-light fs-14" type="checkbox" id="termAndPolicy" />
                <label class="form-check-label" for="termAndPolicy">Agree the Terms & Policy</label>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary fw-semibold py-2">Update Password</button>
            </div>
          </form>

          <p class="mt-4 text-muted text-center mb-4">
            Don’t have a code?
            <a [routerLink]="[]" class="text-decoration-underline link-offset-2 fw-semibold">Resend</a>
            or
            <a [routerLink]="[]" class="text-decoration-underline link-offset-2 fw-semibold">Call Us</a>
          </p>
          <p class="text-muted text-center mb-0">
            Return to
            <a routerLink="/auth/sign-in" class="text-decoration-underline link-offset-3 fw-semibold">Sign in</a>
          </p>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{currentYear}} {{name}} — by
          <span class="fw-semibold">{{author}}</span>
        </p>
      </div>
    </div>
  </div>
</div>
