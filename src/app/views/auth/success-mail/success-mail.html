<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>
          <div class="auth-brand text-center mb-3">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
          </div>

          <div class="mb-4">
            <div class="avatar-xxl mx-auto mt-2">
              <div class="avatar-title bg-light-subtle border border-light border-dashed rounded-circle">
                <img src="assets/images/checkmark.png" alt="dark logo" height="64" />
              </div>
            </div>
          </div>

          <h4 class="fw-bold text-center mb-4">Check Your Email</h4>

          <p class="text-muted text-center mb-4">{{ message }}</p>

          @if (email) {
            <p class="text-muted text-center small mb-4">
              Sent to: <strong>{{ email }}</strong>
            </p>
          }

          <div class="d-grid gap-2">
            <a routerLink="/auth/sign-in" class="btn btn-primary fw-semibold py-2">Back to Sign In</a>
            <button class="btn btn-outline-secondary fw-semibold py-2" (click)="resendEmail()">Resend Email</button>
          </div>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{ currentYear }} {{ name }} — by
          <span class="fw-semibold">{{ author }}</span>
        </p>
      </div>
    </div>
  </div>
</div>
