<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-4 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="position-absolute top-0 end-0" style="width: 180px">
            <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
          </div>
          <div class="auth-brand text-center mb-3 position-relative">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
          </div>

          <div class="mb-4">
            <div class="avatar-xxl mx-auto mt-2">
              <div class="avatar-title bg-light-subtle border border-light border-dashed rounded-circle">
                <img src="assets/images/delete.png" alt="dark logo" height="64" />
              </div>
            </div>
          </div>

          <h4 class="fw-bold text-center mb-3">Delete Account</h4>
          <p class="text-muted text-center mb-4">Enter your password to confirm you want to permanently delete your account. This action cannot be undone.</p>

          <form (ngSubmit)="onSubmit(f)" #f="ngForm">
            <div class="mb-3">
              <label for="password" class="form-label">
                Password
                <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required [(ngModel)]="password" />
              </div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="confirmDelete" name="confirmDelete" required [(ngModel)]="confirmed" />
              <label class="form-check-label" for="confirmDelete">I understand this action is irreversible</label>
            </div>

            @if (error) {
              <div class="alert alert-danger">{{ error }}</div>
            }

            <div class="d-grid">
              <button type="submit" class="btn btn-danger fw-semibold py-2" [disabled]="loading || !confirmed">
                @if (loading) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Deleting...
                } @else {
                  Delete Account
                }
              </button>
            </div>
          </form>

          <p class="text-muted text-center mt-4 mb-0">
            <a routerLink="/" class="text-decoration-underline link-offset-3 fw-semibold">Cancel</a>
          </p>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{ currentYear }} {{ name }} — by
          <span class="fw-semibold">{{ author }}</span>
        </p>
      </div>
    </div>
  </div>
</div>
