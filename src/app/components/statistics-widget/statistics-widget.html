<div class="card h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <div class="avatar avatar-md flex-shrink-0">
        <span class="avatar-title rounded-circle fs-24" [class]="avatarClass">
          <iconify-icon [icon]="icon"></iconify-icon>
        </span>
      </div>
      <div class="text-end">
        <h3 class="mb-1 fw-bold text-dark">
          <span
            [countUp]="value"
            [countUpOptions]="{
              prefix: prefix || '',
              suffix: suffix || '',
              decimalPlaces: calculatedDecimals
            }"
          ></span>
        </h3>
        <p class="mb-0 text-muted fs-xs text-uppercase fw-semibold">{{ title }}</p>
      </div>
    </div>
    @if (trend) {
    <div class="mt-3 pt-2 border-top d-flex justify-content-between align-items-center fs-xs">
      <span [class]="trend.isUp ? 'text-success' : 'text-danger'">
        <iconify-icon [icon]="trend.isUp ? 'tabler:trending-up' : 'tabler:trending-down'" class="me-1"></iconify-icon>
        {{ trend.value }}%
      </span>
      <span class="text-muted">{{ trend.text || 'vs mois dernier' }}</span>
    </div>
    }
  </div>
</div>
